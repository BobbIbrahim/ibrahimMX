spring:
  application:
    name: squad-orchestrator-service
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:squad_orchestrator}
    username: ${DB_USER:squad}
    password: ${DB_PASSWORD:squad}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.murex.mxorbit: ${APPLICATION_LOGGING_LEVEL:INFO}

server:
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info}
