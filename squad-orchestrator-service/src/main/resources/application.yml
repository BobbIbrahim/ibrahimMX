spring:
  application:
    name: squad-orchestrator-service
  temporal:
    connection:
      target: ${TEMPORAL_HOST:localhost}:${TEMPORAL_PORT:7233}
    namespace: ${TEMPORAL_NAMESPACE:default}
    workers-auto-discovery:
      packages:
        - com.murex.mxorbit.squadorchestrator
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:squad_orchestrator}
    username: ${DB_USER:squad_orchestrator_app}
    password: ${DB_PASSWORD:squad_orchestrator_app}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    baseline-on-migrate: true
    validate-on-migrate: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.murex.mxorbit: ${APPLICATION_LOGGING_LEVEL:INFO}

server:
  error:
    include-message: ${SERVER_ERROR_INCLUDE_MESSAGE:never}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_EXPOSURE_INCLUDE:health,info}

agent-service:
  base-url: ${AGENT_SERVICE_BASE_URL:http://localhost:8000}

mxorbit:
  security:
    enabled: ${MXORBIT_SECURITY_ENABLED:false}
    issuer-uri: ${MXORBIT_SECURITY_ISSUER_URI:}
    audience: ${MXORBIT_SECURITY_AUDIENCE:}
    required-scope: ${MXORBIT_SECURITY_REQUIRED_SCOPE:}
    allowed-origins: ${MXORBIT_SECURITY_ALLOWED_ORIGINS:}
