<section class="feature-page">
  <app-page-header
    eyebrow="SQUADS"
    title="Agent Squads"
    description="Group agents into reusable execution units for hardcoded flows and prompt-driven collaboration."
    actionLabel="New Squad"
    actionIcon="add"
    (actionClick)="onCreateSquad()"
  />

  
  <div class="squad-grid">
    @for (squad of squads(); track squad.id) {
      <app-squad-card [squad]="squad" />
    }
  </div>
</section>
