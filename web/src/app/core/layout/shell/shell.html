<div class="app-shell" [class.app-shell--nav-open]="isNavOpen()">
  <header class="topbar">
    <button
      type="button"
      class="topbar__icon-button"
      aria-label="Toggle navigation"
      [attr.aria-expanded]="isNavOpen()"
      (click)="toggleNav()"
    >
      <mat-icon>{{ isNavOpen() ? 'close' : 'menu' }}</mat-icon>
    </button>

    <div class="topbar__brand">
      <mat-icon>hub</mat-icon>
      <strong>Mxorbit</strong>
    </div>

    <button
      type="button"
      class="topbar__icon-button"
      [attr.aria-label]="themeService.toggleLabel()"
      (click)="themeService.toggleTheme()"
    >
      <mat-icon>{{ themeService.toggleIcon() }}</mat-icon>
    </button>
  </header>

  <div class="nav-backdrop" (click)="closeNav()"></div>

  <aside class="sidebar">
    <div class="brand">
      <div class="brand__mark">
        <mat-icon>hub</mat-icon>
      </div>

      <div class="brand__text">
        <span class="brand__eyebrow">Mxorbit</span>
        <strong>Control Panel</strong>
      </div>
    </div>

    <nav class="nav">
      @for (item of navigationItems; track item.route) {
        <a
          class="nav__link"
          routerLinkActive="nav__link--active"
          [routerLink]="item.route"
          [routerLinkActiveOptions]="{ exact: true }"
          (click)="closeNav()"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="sidebar__footer">
      <button
        type="button"
        mat-stroked-button
        class="theme-button"
        (click)="themeService.toggleTheme()"
        >
        <mat-icon>{{ themeService.toggleIcon() }}</mat-icon>
        <span>{{ themeService.toggleLabel() }}</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <router-outlet></router-outlet>
  </main>
</div>
