<section class="feature-page">
  <app-page-header
    eyebrow="AUTOPILOT"
    title="Scheduled AI Tasks"
    description="Schedule a squad to run on a recurring basis, without anyone having to kick it off."
    badgeLabel="Sample data"
    badgeIcon="science"
    actionLabel="New Autopilot"
    actionIcon="add"
    (actionClick)="onCreateAutopilot()"
  />

  @if (autopilots().length > 0) {
    <div class="autopilot-grid">
      @for (autopilot of autopilots(); track autopilot.id) {
        <app-autopilot-card
          [autopilot]="autopilot"
          (pauseRequested)="onPauseAutopilot($event)"
          (resumeRequested)="onResumeAutopilot($event)"
        />
      }
    </div>
  } @else {
    <div class="empty-state">
      <div class="empty-state__icon">
        <span>AP</span>
      </div>

      <h2>No autopilots configured yet</h2>

      <p>
        Create your first autopilot to schedule a squad to run a recurring task automatically.
      </p>
    </div>
  }
</section>
