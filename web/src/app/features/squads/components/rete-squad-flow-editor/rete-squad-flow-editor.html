<div class="rete-squad-flow-editor" #reteContainer>
  @if (hasRouteLabels) {
  <button
    type="button"
    class="rete-canvas-toggle"
    [class.rete-canvas-toggle--active]="routeLabelsVisible()"
    [attr.aria-pressed]="routeLabelsVisible()"
    title="Show or hide the branching conditions evaluated at each decision node"
    (pointerdown)="$event.stopPropagation()"
    (click)="toggleRouteLabels()"
  >
    <span class="rete-canvas-toggle__switch"></span>
    Branch rules
  </button>
  }

  <div class="rete-zoom-controls" (pointerdown)="$event.stopPropagation()">
    <button
      type="button"
      class="rete-zoom-controls__button rete-zoom-controls__button--fit"
      aria-label="Fit flow to view"
      title="Fit flow to view"
      (click)="zoomToFit()"
    >
      Fit
    </button>
  </div>
</div>
