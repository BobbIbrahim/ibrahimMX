<article
  class="squad-card"
  [style.--type-primary]="typeDescriptor().color"
  [style.--type-secondary]="typeDescriptor().secondaryColor"
  [style.--type-soft]="typeDescriptor().soft"
>
  <header class="squad-card__header">
    <div class="squad-card__icon" [style.background]="typeDescriptor().gradient">
      <mat-icon>{{ typeDescriptor().icon }}</mat-icon>
    </div>

    <div class="squad-card__identity">
      <div class="squad-card__title-row">
        <h2>{{ squad().name }}</h2>

        <div class="squad-card__actions">
          <span class="status-badge" [class]="'status-badge--' + squad().status">
            {{ squad().status }}
          </span>

          <button
            type="button"
            mat-icon-button
            class="delete-squad-button"
            [attr.aria-label]="'Delete squad ' + squad().name"
            (click)="deleteSquad($event)"
          >
            <mat-icon>delete</mat-icon>
          </button>
        </div>
      </div>

      <p>{{ squad().description }}</p>
    </div>
  </header>

  <section class="squad-card__details" aria-label="Squad details">
    <div
      class="squad-type-badge"
      [title]="typeDescriptor().description"
    >
      <mat-icon>{{ typeDescriptor().icon }}</mat-icon>

      <span>{{ typeDescriptor().label }}</span>
    </div>

    <section class="squad-card__metrics" aria-label="Squad metrics">
      <div class="squad-metric">
        <mat-icon>format_list_numbered</mat-icon>

        <div class="squad-metric__content">
          <span class="metric-value">{{ squad().metrics.steps }}</span>
          <span class="metric-label">Steps</span>
        </div>
      </div>

      <div class="squad-metric">
        <mat-icon>timeline</mat-icon>

        <div class="squad-metric__content">
          <span class="metric-value">{{ squad().metrics.edges }}</span>
          <span class="metric-label">Edges</span>
        </div>
      </div>

      <div class="squad-metric">
        <mat-icon>group</mat-icon>

        <div class="squad-metric__content">
          <span class="metric-value">{{ squad().metrics.members }}</span>
          <span class="metric-label">Members</span>
        </div>
      </div>
    </section>
  </section>

  <footer class="squad-card__footer">
    <button
      type="button"
      mat-flat-button
      class="open-squad-button"
      [attr.aria-label]="'Open squad ' + squad().name"
      (click)="openSquad()"
    >
      <span class="open-squad-button__label">Open Squad</span>
      <mat-icon class="open-squad-button__icon">arrow_forward</mat-icon>
    </button>
  </footer>
</article>
